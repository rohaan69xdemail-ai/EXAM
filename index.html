<!DOCTYPE html>
<html lang="bn">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        'bengali-serif': ['"Noto Serif Bengali"', 'serif'],
                        'bengali-sans': ['"Hind Siliguri"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Font style classes */
        .bengali-text-serif {
            font-family: 'Noto Serif Bengali', serif;
            line-height: 1.8;
        }
        .bengali-text-sans {
            font-family: 'Hind Siliguri', sans-serif;
            line-height: 1.7;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1E293B;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748B;
        }

        /* Study mode styles */
        .hide-answer .answer-text {
            filter: blur(8px);
            opacity: 0.5;
            user-select: none;
            transition: all 0.3s ease;
        }
        .dark .hide-answer .answer-text {
            filter: blur(8px);
            opacity: 0.3;
        }
        .hide-answer .answer-text:hover {
            filter: blur(0px);
            opacity: 1;
            cursor: pointer;
        }
        
        /* Tab styles */
        .tab-active {
            border-bottom: 3px solid #4F46E5;
            color: #4F46E5;
            font-weight: 600;
        }
        .dark .tab-active {
            border-bottom-color: #818CF8;
            color: #818CF8;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200">

            <div class="flex justify-center mt-8">

    </div>

    <!-- Top Header (Scrolls away naturally) -->
    <header class="relative bg-white dark:bg-slate-800 transition-colors duration-300 py-6 md:py-10">

        <button onclick="toggleTheme()" class="absolute top-4 right-4 md:top-6 md:right-8 p-2.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all duration-300 focus:outline-none" aria-label="Toggle Dark Mode">
            <!-- Sun Icon (shows in dark mode) -->
            <svg id="theme-icon-light" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>

        <div class="max-w-4xl mx-auto px-6 sm:px-12 text-center mt-2">

            <p class="text-xs md:text-base text-slate-500 dark:text-slate-400 mt-1 md:mt-2 bengali-text-sans font-medium">

    </header>
        
    <!-- Tab Navigation (iOS Liquid Glass Sticky Pane) -->
    <div class="sticky top-0 z-30 bg-white/70 dark:bg-slate-900/70 backdrop-blur-lg border-b border-slate-200/50 dark:border-slate-700/50 transition-colors duration-300" style="-webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);">
        <div class="max-w-4xl mx-auto px-2 sm:px-6 lg:px-8 flex justify-center">
            <button id="tab-ka" class="px-3 sm:px-6 py-3 text-base sm:text-lg bengali-text-sans tab-active text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors border-b-[3px] border-transparent" style="margin-bottom: -1px;" onclick="switchTab('ka')">

            </button>
            <button id="tab-kha" class="px-3 sm:px-6 py-3 text-base sm:text-lg bengali-text-sans text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors border-b-[3px] border-transparent" style="margin-bottom: -1px;" onclick="switchTab('kha')">

    </div>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 md:py-8">
        
        <!-- Study Controls -->
        <div class="flex justify-between items-center mb-6 bg-white dark:bg-slate-800 p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors duration-300">
            <div class="text-sm font-medium text-slate-500 dark:text-slate-400">

            <div class="flex items-center space-x-3 cursor-pointer group" onclick="toggleStudyMode()">

            </div>
        </div>
        <p id="study-hint" class="text-xs text-center text-indigo-500 dark:text-indigo-400 mb-6 hidden bengali-text-sans">

        </p>

        <!-- Question Container -->
        <div id="content-container" class="space-y-4">
            <!-- Content will be injected here by JavaScript -->
        </div>

    </main>

    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-auto py-6 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4 text-center text-slate-400 dark:text-slate-500 text-sm bengali-text-sans">
            নিয়মিত অধ্যয়ন করুন এবং নিজের প্রস্তুতি যাচাই করুন। শুভকামনা!
        </div>
    </footer>

    <script>
        // Data for Section A (ক-বিভাগ)
        const kaData = [
            { q: "বাংলাদেশের ভূ-প্রকৃতি কেমন?", a: "ব-দ্বীপ আকৃতির।" },
            { q: "বাঙালি সংকর জাতি কেন?", a: "নানা জাতির মিশ্রণে গঠিত বলে।" },
            { q: "'বঙ্গ' নামের প্রথম উল্লেখ কোথায় পাওয়া যায়?", a: "ঐতরেয় আরণ্যক গ্রন্থে।" },

            { q: "লাহোর প্রস্তাব কবে উত্থাপিত হয়?", a: "1940 সালের 23 মার্চ।" },
            { q: "লাহোর প্রস্তাব কে উত্থাপন করেন?", a: "শেরে বাংলা এ. কে. ফজলুল হক।" },
            { q: "দ্বিজাতি তত্ত্বের প্রবক্তা কে?", a: "মুহাম্মদ আলী জিন্নাহ।" },
            { q: "ভারত ও পাকিস্তান কবে স্বাধীন হয়?", a: "যথাক্রমে 15 আগস্ট ও 14 আগস্ট 1947।" },
            { q: "'অখণ্ড স্বাধীন বাংলা' গঠনের প্রস্তাব কে দিয়েছিলেন?", a: "হোসেন শহীদ সোহরাওয়ার্দী ও শরৎচন্দ্র বসু।" },
            { q: "পাকিস্তানের প্রথম গভর্নর জেনারেল কে ছিলেন?", a: "মুহাম্মদ আলী জিন্নাহ।" },
            { q: "তমুদ্দুন মজলিস কবে গঠিত হয়?", a: "2 সেপ্টেম্বর 1947।" },
            { q: "তমুদ্দুন মজলিস কে প্রতিষ্ঠা করেন?", a: "অধ্যাপক আবুল কাসেম।" },
            { q: "রাষ্ট্রভাষা সংগ্রাম পরিষদ কবে গঠিত হয়?", a: "1 অক্টোবর 1948।" },
            { q: "'উর্দুই হবে পাকিস্তানের একমাত্র রাষ্ট্রভাষা' কথাটি কে বলেছিলেন?", a: "মুহাম্মদ আলী জিন্নাহ।" },
            { q: "1952 সালের 21 শে ফেব্রুয়ারি কী বার ছিল?", a: "বৃহস্পতিবার।" },
            { q: "21 শে ফেব্রুয়ারি বাংলার কত তারিখ ছিল?", a: "8 ফাল্গুন 1358 বঙ্গাব্দ।" },
            { q: "কেন্দ্রীয় শহীদ মিনারের স্থপতি কে?", a: "হামিদুর রহমান।" },

            { q: "আওয়ামী মুসলিম লীগ কবে গঠিত হয়?", a: "23 জুন 1949 (ঢাকার রোজ গার্ডেনে)।" },

            { q: "যুক্তফ্রন্টের নির্বাচনী প্রতীক কী ছিল?", a: "নৌকা।" },

            { q: "মৌলিক গণতন্ত্র (Basic Democracy) কে প্রবর্তন করেন?", a: "আইয়ুব খান।" },

            { q: "আগরতলা ষড়যন্ত্র মামলার প্রধান আসামি কে ছিলেন?", a: "বঙ্গবন্ধু শেখ মুজিবুর রহমান।" },
            { q: "আগরতলা মামলার মোট আসামি কতজন ছিল?", a: "35 জন (বঙ্গবন্ধুসহ)।" },
            { q: "আগরতলা ষড়যন্ত্র মামলার প্রকৃত নাম কী ছিল?", a: "রাষ্ট্র বনাম শেখ মুজিবুর রহমান ও অন্যান্য।" },

                a: "1972 সালের 4 নভেম্বর গণপরিষদে গৃহীত এবং 16 ডিসেম্বর থেকে কার্যকর হওয়া বাংলাদেশের সংবিধানে রাষ্ট্র পরিচালনার জন্য চারটি স্তম্ভ বা মূলনীতি নির্ধারণ করা হয় (সংবিধানের 8নং অনুচ্ছেদ অনুযায়ী):\n1. জাতীয়তাবাদ: ভাষা ও সংস্কৃতির ঐক্যবদ্ধতার ভিত্তিতে শক্তিশালী বাঙালি জাতি গঠন।\n2. সমাজতন্ত্র: শোষণমুক্ত সমাজ ও অর্থনৈতিক সমতা প্রতিষ্ঠা করা।\n3. গণতন্ত্র: মৌলিক মানবাধিকার নিশ্চিতকরণ এবং জনপ্রতিনিধিত্বমূলক সরকার প্রতিষ্ঠা।\n4. ধর্মনিরপেক্ষতা: রাষ্ট্রে কোনো ধর্মের প্রতি পক্ষপাতিত্ব না করা এবং সকলের নিজ নিজ ধর্ম পালনের স্বাধীনতা নিশ্চিত করা।" 
            },
            { 
                q: "বাকশাল (BAKSAL) কেন গঠিত হয়েছিল?", 
                a: "1975 সালের 24 জানুয়ারি সংবিধানের চতুর্থ সংশোধনীর মাধ্যমে জাতির পিতা বঙ্গবন্ধু শেখ মুজিবুর রহমান দেশে বহুদলীয় সংসদীয় প্রথার বদলে 'বাংলাদেশ কৃষক শ্রমিক আওয়ামী লীগ' সংক্ষেপে 'বাকশাল' নামক একক জাতীয় দল গঠন করেন।\nকারণ: যুদ্ধবিধ্বস্ত দেশ পুনর্গঠন, চরম অর্থনৈতিক সংকট মোকাবিলা, দুর্নীতি ও কালোবাজারি রোধ এবং রাজনৈতিক গুপ্তহত্যা ও অস্থিতিশীলতা দূর করার জন্য জাতীয় ঐক্যের প্রয়োজন ছিল। প্রশাসন বিকেন্দ্রীকরণ ও কৃষিখাতে উৎপাদন বাড়িয়ে দ্রুত অর্থনৈতিক মুক্তির লক্ষ্যে বঙ্গবন্ধু এই নতুন রাজনৈতিক ও প্রশাসনিক কাঠামো (যাকে তিনি 'দ্বিতীয় বিপ্লব' বলেছিলেন) প্রবর্তন করেছিলেন।" 
            }
        ];

        let currentTab = 'ka';
        let isStudyMode = false;

        // Initialize Theme from localStorage or system preference
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        initTheme();

        // Toggle Theme
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update Tab UI
            document.getElementById('tab-ka').classList.remove('tab-active', 'border-transparent');
            document.getElementById('tab-kha').classList.remove('tab-active', 'border-transparent');
            
            if(tab === 'ka') {
                document.getElementById('tab-ka').classList.add('tab-active');
                document.getElementById('tab-kha').classList.add('border-transparent');
                document.getElementById('question-count').innerText = kaData.length;
            } else {
                document.getElementById('tab-kha').classList.add('tab-active');
                document.getElementById('tab-ka').classList.add('border-transparent');
                document.getElementById('question-count').innerText = khaData.length;
            }

            renderContent();
        }

        function toggleStudyMode() {
            isStudyMode = !isStudyMode;
            
            const dot = document.getElementById('toggleDot');
            const bg = document.getElementById('toggleBg');
            const hint = document.getElementById('study-hint');
            const container = document.getElementById('content-container');
            
            if(isStudyMode) {
                dot.style.transform = 'translateX(100%)';
                bg.classList.remove('bg-slate-200', 'dark:bg-slate-600');
                bg.classList.add('bg-indigo-500');
                container.classList.add('hide-answer');
                hint.classList.remove('hidden');
            } else {
                dot.style.transform = 'translateX(0)';
                bg.classList.add('bg-slate-200', 'dark:bg-slate-600');
                bg.classList.remove('bg-indigo-500');
                container.classList.remove('hide-answer');
                hint.classList.add('hidden');
            }
        }

        function formatAnswer(text) {
            return text.replace(/\n/g, '<br/>');
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            container.innerHTML = ''; 
            
            const dataToRender = currentTab === 'ka' ? kaData : khaData;

            dataToRender.forEach((item, index) => {
                const num = parseInt(index) + 1;
                
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 p-5 md:p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md dark:hover:shadow-lg transition-all duration-300";
                
                const qClass = currentTab === 'ka' 
                                ? `text-base md:text-lg font-semibold text-slate-800 dark:text-slate-100 bengali-text-sans mb-2`
                                : `text-lg md:text-xl font-bold text-indigo-900 dark:text-indigo-300 bengali-text-sans mb-3 pb-2 border-b border-indigo-50 dark:border-slate-700`;
                
                const aClass = currentTab === 'ka'
                                ? `text-base text-emerald-700 dark:text-emerald-400 bengali-text-sans answer-text font-medium`
                                : `text-base md:text-lg text-slate-700 dark:text-slate-300 bengali-text-sans leading-relaxed answer-text`;

                const prefix = currentTab === 'ka' ? "উত্তর: " : "";

                card.innerHTML = `
                    <div class="flex items-start">
                        <div class="flex-shrink-0 mr-3 md:mr-4 mt-1">
                            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-50 dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 font-bold text-sm border border-indigo-100 dark:border-slate-600">
                                ${num.toLocaleString('bn-BD')}
                            </span>
                        </div>
                        <div class="flex-grow overflow-hidden">
                            <h3 class="${qClass}">${item.q}</h3>
                            <div class="${aClass}">
                                ${prefix}${formatAnswer(item.a)}
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Initial render
        renderContent();

        // Splash screen logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    // Fade out
                    splash.style.opacity = '0';
                    // Remove from DOM flow after transition
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 700); 
                }
            }, 1800); // Show for 1.8 seconds
        });
    </script>
</body>
</html>
